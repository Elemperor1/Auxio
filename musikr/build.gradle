import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'com.android.library'
    id "com.google.devtools.ksp"
    id "com.diffplug.spotless"
    id "kotlin-parcelize"
    id "org.jetbrains.dokka"
}

android {
    namespace = 'org.oxycblt.musikr'
    compileSdk target_sdk
    ndkVersion = "$ndk_version"

    defaultConfig {
        minSdk min_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"

    // AndroidX
    implementation "androidx.core:core-ktx:$core_version"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.14.9"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register("assembleTaglib") {
    def projectDirFile = project.projectDir
    def jniDirFile = new File(projectDirFile, "src/main/cpp")
    def pkgDirFile = new File(jniDirFile, "taglib/pkg")
    def abisList = ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
    def isWindowsOS = Os.isFamily(Os.FAMILY_WINDOWS)

    def taglibPackageCompleteCheck = {
        abisList.every { arch ->
            [
                    new File(pkgDirFile, "$arch/lib/libtag.a"),
                    new File(pkgDirFile, "$arch/include/taglib/tstring.h"),
                    new File(pkgDirFile, "$arch/include/taglib/tbytevector.h"),
                    new File(pkgDirFile, "$arch/include/taglib/id3v1tag.h")
            ].every { it.isFile() }
        }
    }

    inputs.files(fileTree(new File(jniDirFile, "taglib")) {
        exclude "pkg/**"
        exclude "build/**"
    })
    outputs.dir(pkgDirFile)
    outputs.upToDateWhen { taglibPackageCompleteCheck() }

    def ndkDirProvider = project.androidComponents.sdkComponents.ndkDirectory
    def sdkDirProvider = project.androidComponents.sdkComponents.sdkDirectory
    def providerFactory = project.providers

    doLast {
        if (taglibPackageCompleteCheck()) return

        def ndkDir = ndkDirProvider.get().asFile
        def sdkDir = sdkDirProvider.get().asFile
        def cmakeExe = new File(sdkDir, "cmake/3.22.1/bin/${isWindowsOS ? 'cmake.exe' : 'cmake'}")
        def cmakeCommand = cmakeExe.exists() ? cmakeExe.absolutePath : "cmake"
        def ninjaExe = new File(cmakeExe.parentFile, isWindowsOS ? "ninja.exe" : "ninja")
        def hasSdkNinja = cmakeExe.exists() && ninjaExe.exists()
        def ndkToolchain = new File(jniDirFile, "android.toolchain.cmake")
        def cmakePath = { file -> file.absolutePath.replace('\\', '/') }

        abisList.each { arch ->
            println "Building TagLib for $arch..."
            def dstDir = new File(jniDirFile, "taglib/build/$arch")
            def archPkgDir = new File(pkgDirFile, arch)
            if (dstDir.exists()) {
                dstDir.deleteDir()
            }

            providerFactory.exec {
                workingDir new File(jniDirFile, "taglib")
                def configureCommand = [
                        cmakeCommand,
                        "-B", cmakePath(dstDir),
                        "-DANDROID_NDK_PATH=${cmakePath(ndkDir)}",
                        "-DCMAKE_TOOLCHAIN_FILE=${cmakePath(ndkToolchain)}",
                        "-DANDROID_ABI=$arch",
                        "-DBUILD_SHARED_LIBS=OFF",
                        "-DVISIBILITY_HIDDEN=ON",
                        "-DBUILD_TESTING=OFF",
                        "-DBUILD_EXAMPLES=OFF",
                        "-DBUILD_BINDINGS=OFF",
                        "-DWITH_ZLIB=OFF",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DWITH_APE=OFF",
                        "-DWITH_ASF=OFF",
                        "-DWITH_MOD=OFF",
                        "-DWITH_SHORTEN=OFF",
                        "-DWITH_TRUEAUDIO=OFF",
                        "-DCMAKE_CXX_FLAGS=-fPIC",
                        "-GNinja"
                ]
                if (hasSdkNinja) {
                    configureCommand += "-DCMAKE_MAKE_PROGRAM=" + cmakePath(ninjaExe)
                }
                commandLine configureCommand
            }.result.get().assertNormalExitValue()

            providerFactory.exec {
                commandLine cmakeCommand, "--build", cmakePath(dstDir), "--config", "Release", "-j", Runtime.runtime.availableProcessors().toString()
            }.result.get().assertNormalExitValue()

            providerFactory.exec {
                commandLine cmakeCommand, "--install", cmakePath(dstDir), "--config", "Release", "--prefix", cmakePath(archPkgDir), "--strip"
            }.result.get().assertNormalExitValue()
        }
    }
}

afterEvaluate {
    preDebugBuild.dependsOn assembleTaglib
    preReleaseBuild.dependsOn assembleTaglib
}

clean {
    delete "$projectDir/src/main/cpp/taglib/pkg"
    delete "$projectDir/src/main/cpp/taglib/build"
}
