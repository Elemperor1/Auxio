import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'com.android.library'
    id "com.google.devtools.ksp"
    id "com.diffplug.spotless"
    id "kotlin-parcelize"
    id "org.jetbrains.dokka"
}

android {
    namespace 'org.oxycblt.musikr'
    compileSdk target_sdk
    ndkVersion "$ndk_version"

    defaultConfig {
        minSdk min_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"

    // AndroidX
    implementation "androidx.core:core-ktx:$core_version"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.14.9"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register("assembleTaglib") {
    def jniDir = "$projectDir/src/main/cpp"
    def pkgDir = new File("$jniDir/taglib/pkg")
    def abis = ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
    def isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
    def taglibPackageComplete = {
        abis.every { arch ->
            [
                    new File(pkgDir, "$arch/lib/libtag.a"),
                    new File(pkgDir, "$arch/include/taglib/tstring.h"),
                    new File(pkgDir, "$arch/include/taglib/tbytevector.h"),
                    new File(pkgDir, "$arch/include/taglib/id3v1tag.h")
            ].every { it.isFile() }
        }
    }
    inputs.files(fileTree("$jniDir/taglib") {
        exclude "pkg/**"
        exclude "build/**"
    })
    outputs.dir(pkgDir)
    outputs.upToDateWhen { taglibPackageComplete() }

    doLast {
        if (taglibPackageComplete()) return

        def ndkDir = androidComponents.sdkComponents.ndkDirectory.get().asFile
        def sdkDir = androidComponents.sdkComponents.sdkDirectory.get().asFile
        def cmakeExe = new File(sdkDir, "cmake/3.22.1/bin/${isWindows ? 'cmake.exe' : 'cmake'}")
        def cmakeCommand = cmakeExe.exists() ? cmakeExe.absolutePath : "cmake"
        def ninjaExe = new File(cmakeExe.parentFile, isWindows ? "ninja.exe" : "ninja")
        def hasSdkNinja = cmakeExe.exists() && ninjaExe.exists()
        def ndkToolchain = new File(jniDir, "android.toolchain.cmake")
        def cmakePath = { file -> file.absolutePath.replace('\\', '/') }

        abis.each { arch ->
            println "Building TagLib for $arch..."
            def dstDir = new File("$jniDir/taglib/build/$arch")
            def archPkgDir = new File(pkgDir, arch)
            if (dstDir.exists()) {
                dstDir.deleteDir()
            }

            providers.exec {
                workingDir "$jniDir/taglib"
                def configureCommand = [
                        cmakeCommand,
                        "-B", cmakePath(dstDir),
                        "-DANDROID_NDK_PATH=${cmakePath(ndkDir)}",
                        "-DCMAKE_TOOLCHAIN_FILE=${cmakePath(ndkToolchain)}",
                        "-DANDROID_ABI=$arch",
                        "-DBUILD_SHARED_LIBS=OFF",
                        "-DVISIBILITY_HIDDEN=ON",
                        "-DBUILD_TESTING=OFF",
                        "-DBUILD_EXAMPLES=OFF",
                        "-DBUILD_BINDINGS=OFF",
                        "-DWITH_ZLIB=OFF",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DWITH_APE=OFF",
                        "-DWITH_ASF=OFF",
                        "-DWITH_MOD=OFF",
                        "-DWITH_SHORTEN=OFF",
                        "-DWITH_TRUEAUDIO=OFF",
                        "-DCMAKE_CXX_FLAGS=-fPIC",
                        "-GNinja"
                ]
                if (hasSdkNinja) {
                    configureCommand += "-DCMAKE_MAKE_PROGRAM=" + cmakePath(ninjaExe)
                }
                commandLine configureCommand
            }.result.get().assertNormalExitValue()

            providers.exec {
                commandLine cmakeCommand, "--build", cmakePath(dstDir), "--config", "Release", "-j", Runtime.runtime.availableProcessors().toString()
            }.result.get().assertNormalExitValue()

            providers.exec {
                commandLine cmakeCommand, "--install", cmakePath(dstDir), "--config", "Release", "--prefix", cmakePath(archPkgDir), "--strip"
            }.result.get().assertNormalExitValue()
        }
    }
}

afterEvaluate {
    preDebugBuild.dependsOn assembleTaglib
    preReleaseBuild.dependsOn assembleTaglib
}

clean {
    delete "$projectDir/src/main/cpp/taglib/pkg"
    delete "$projectDir/src/main/cpp/taglib/build"
}
